# 서버/클라이언트 빌드와 배포
#  - PR, main push : 빌드 검사
#  - main push     : "latest" 개발 빌드 릴리스를 최신 커밋으로 교체
#  - v* 태그 push  : 버전 릴리스 생성 (영구 보존)
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']        # 문서만 바뀐 push는 빌드하지 않음 (태그 push에는 적용되지 않음)
  pull_request:

# 같은 브랜치/태그의 실행은 하나씩 순서대로 - 늦게 끝난 예전 실행이 최신 빌드를 덮어쓰지 않게 한다.
# 진행 중인 실행을 취소하지 않는 이유: 릴리스를 지운 직후 취소되면 릴리스가 없는 상태로 남는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022          # VS 2022 (프로젝트 툴셋 v143)
    permissions:
      contents: write              # 릴리스 생성/삭제
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # 빌드 서버에 설치된 vcpkg를 MSBuild에 연결한다.
      # fetch: SERVER/vcpkg.json의 builtin-baseline 커밋이 빌드 서버의 vcpkg보다 새로울 때를 대비
      - name: vcpkg 준비
        run: |
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --quiet origin
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      # cpp-redis는 SERVER/vcpkg.json을 보고 vcpkg가 설치한다 (VcpkgEnableManifest)
      - name: 서버 빌드
        run: msbuild SERVER\2024_GameServer_Term.sln /p:Configuration=Release /p:Platform=x64 /m /nologo

      # SFML은 CLIENT/client/packages.config의 NuGet 패키지를 복원해서 쓴다
      - name: 클라이언트 빌드
        run: |
          msbuild CLIENT\client.sln /t:restore /p:RestorePackagesConfig=true /nologo
          msbuild CLIENT\client.sln /p:Configuration=Release /p:Platform=x64 /m /nologo

      # 실행에 필요한 파일만 모은다 (서버는 npc.lua, 클라이언트는 Resources/를 실행 폴더 기준으로 읽는다)
      - name: 압축
        run: |
          New-Item -ItemType Directory dist\server, dist\client | Out-Null
          Copy-Item SERVER\x64\Release\2024_GameServer_Term.exe, SERVER\npc.lua dist\server
          Copy-Item SERVER\sql dist\server -Recurse
          Copy-Item CLIENT\x64\Release\client.exe dist\client
          Copy-Item CLIENT\client\Resources dist\client -Recurse
          Compress-Archive dist\server\* dist\GameServer.zip
          Compress-Archive dist\client\* dist\GameClient.zip

      # 모든 실행의 결과 보관 (확인용 - 로그인 필요, 90일 후 삭제)
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/*.zip

      # main push: 개발 빌드 교체. 다운로드 주소는 항상 .../releases/download/latest/GameClient.zip
      - name: 개발 빌드 갱신
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/GameServer.zip dist/GameClient.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "개발 빌드 (${GITHUB_SHA::7})" \
            --notes "main 브랜치 최신 커밋을 자동으로 빌드한 파일입니다. 정식 버전은 v로 시작하는 릴리스를 받으세요."

      # v* 태그 push: 버전 릴리스
      - name: 정식 릴리스
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
